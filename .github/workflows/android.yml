name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # The main-branch job publishes the verified debug APK as an explicit prerelease.
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit tests, debug APK and optional signed release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SIGNING_ENABLED: ${{ secrets.PRIVATE_CLOUD_KEYSTORE_BASE64 != '' && secrets.PRIVATE_CLOUD_KEYSTORE_PASSWORD != '' && secrets.PRIVATE_CLOUD_KEY_ALIAS != '' && secrets.PRIVATE_CLOUD_KEY_PASSWORD != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;34.0.0

      - name: Set up Gradle 8.9
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Confirm build tool versions
        run: |
          test "${{ steps.setup-gradle.outputs.gradle-version }}" = "8.9"
          java -version
          gradle --version

      - name: Run lint, unit tests and assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Publish concise Gradle failure annotation
        if: failure()
        env:
          BUILD_LOG: gradle-build.log
        run: |
          python3 - <<'PY'
          import os

          path = os.environ["BUILD_LOG"]
          if not os.path.isfile(path):
              print("::error title=Gradle build failed::Gradle did not create a build log")
              raise SystemExit(0)

          with open(path, "r", encoding="utf-8", errors="replace") as stream:
              text = stream.read()
          excerpt = text[-12000:]
          escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failed::{escaped}")
          PY

      - name: Verify resolved security dependency
        run: |
          gradle --no-daemon --max-workers=2 --console=plain :app:dependencyInsight --configuration debugRuntimeClasspath --dependency org.bouncycastle:bcprov-jdk18on > dependency-insight.txt
          selected="$(awk '/^org[.]bouncycastle:bcprov-jdk18on:/ { print $1; exit }' dependency-insight.txt)"
          test "$selected" = 'org.bouncycastle:bcprov-jdk18on:1.84'

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Materialize release keystore from GitHub Secrets
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        env:
          PRIVATE_CLOUD_KEYSTORE_BASE64: ${{ secrets.PRIVATE_CLOUD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$PRIVATE_CLOUD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/private-cloud-release.jks"

      - name: Build and verify signed release APK
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        env:
          PRIVATE_CLOUD_KEYSTORE_FILE: ${{ runner.temp }}/private-cloud-release.jks
          PRIVATE_CLOUD_KEYSTORE_PASSWORD: ${{ secrets.PRIVATE_CLOUD_KEYSTORE_PASSWORD }}
          PRIVATE_CLOUD_KEY_ALIAS: ${{ secrets.PRIVATE_CLOUD_KEY_ALIAS }}
          PRIVATE_CLOUD_KEY_PASSWORD: ${{ secrets.PRIVATE_CLOUD_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --max-workers=2 :app:assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: private-cloud-release-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/private-cloud-release.jks"

      - name: Write APK checksum
        working-directory: app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: private-cloud-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Stage versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version_name="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'/\1/p" app/build.gradle)"
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v$version_name"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/private-cloud-$GITHUB_REF_NAME-debug.apk"
          if test -f app/build/outputs/apk/release/app-release.apk; then
            cp app/build/outputs/apk/release/app-release.apk \
              "release-assets/private-cloud-$GITHUB_REF_NAME-release.apk"
          fi
          (
            cd release-assets
            sha256sum -- *.apk > "private-cloud-$GITHUB_REF_NAME.sha256"
          )

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists; leaving its immutable assets unchanged."
            else
              release_args=(
                "$GITHUB_REF_NAME"
                release-assets/*
                --repo "$GITHUB_REPOSITORY"
                --title "Private Cloud $GITHUB_REF_NAME"
                --notes-file "docs/releases/$GITHUB_REF_NAME.md"
                --verify-tag
              )
              if ! test -f "release-assets/private-cloud-$GITHUB_REF_NAME-release.apk"; then
                release_args+=(--prerelease)
              fi
              gh release create "${release_args[@]}"
            fi
          } 2>&1 | tee release-publish.log

      - name: Publish release failure annotation
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os

          path = "release-publish.log"
          message = "Release command failed without a log"
          if os.path.isfile(path):
              with open(path, "r", encoding="utf-8", errors="replace") as stream:
                  message = stream.read()[-6000:]
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=GitHub release failed::{escaped}")
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-cloud-unit-test-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-cloud-lint-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
