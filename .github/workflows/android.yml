name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # The main-branch job publishes the verified debug APK as an explicit prerelease.
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;34.0.0

      - name: Set up Gradle 8.9
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Confirm build tool versions
        run: |
          test "${{ steps.setup-gradle.outputs.gradle-version }}" = "8.9"
          java -version
          gradle --version

      - name: Run lint, unit tests and assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Publish concise Gradle failure annotation
        if: failure()
        env:
          BUILD_LOG: gradle-build.log
        run: |
          python3 - <<'PY'
          import os

          path = os.environ["BUILD_LOG"]
          if not os.path.isfile(path):
              print("::error title=Gradle build failed::Gradle did not create a build log")
              raise SystemExit(0)

          with open(path, "r", encoding="utf-8", errors="replace") as stream:
              text = stream.read()
          excerpt = text[-12000:]
          escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failed::{escaped}")
          PY

      - name: Verify resolved security dependency
        run: |
          gradle --no-daemon --max-workers=2 --console=plain :app:dependencyInsight --configuration debugRuntimeClasspath --dependency org.bouncycastle:bcprov-jdk18on > dependency-insight.txt
          selected="$(awk '/^org[.]bouncycastle:bcprov-jdk18on:/ { print $1; exit }' dependency-insight.txt)"
          test "$selected" = 'org.bouncycastle:bcprov-jdk18on:1.84'

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Write APK checksum
        working-directory: app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Publish v0.1.0 debug prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-debug
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its immutable assets unchanged."
          else
            gh release create "$RELEASE_TAG" \
              app/build/outputs/apk/debug/app-debug.apk \
              app/build/outputs/apk/debug/app-debug.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Private Cloud v0.1.0 (debug)' \
              --notes '测试预发布：支持 WebDAV、SMB、SAF 指定目录、不可变快照备份及恢复。APK 使用 Android debug 密钥签名。' \
              --prerelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: private-cloud-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-cloud-unit-test-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-cloud-lint-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
