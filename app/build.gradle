plugins {
    id 'com.android.application'
}

android {
    namespace 'com.privatecloud.app'
    compileSdk 35
    // AGP 8.7's supported default; compileSdk/targetSdk remain API 35.
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.privatecloud.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // The crypto, SMB, HTTP and WorkManager graph can exceed one DEX file. API 26 has
        // platform multidex support, so no legacy multidex runtime is needed.
        multiDexEnabled true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
        viewBinding false
    }

    lint {
        abortOnError true
        checkDependencies true
    }
}

dependencies {
    // 5.4.0's Android artifact requires compileSdk 36. Version 5.3.2 retains the
    // same public API used here while remaining compatible with this API 35 build.
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation('eu.agno3.jcifs:jcifs-ng:2.1.10') {
        // The upstream POM pins bcprov-jdk18on 1.76. Keep it out of the graph and
        // supply the security-fixed, API-compatible version explicitly below.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    // WorkManager 2.11.2 is the current stable line. It requires minSdk 23 and
    // compileSdk 33+, both within this app's API 26 / API 35 build matrix.
    implementation 'androidx.work:work-runtime:2.11.2'

    // jcifs-ng 2.1.10 declares bcprov 1.76. Override it because that release is affected by
    // published cryptographic advisories, including CVE-2025-14813; 1.84 contains the fix.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'

    // jcifs-ng uses SLF4J. Its API arrives transitively; this Android backend
    // prevents the fallback no-provider warning at runtime.
    runtimeOnly 'org.slf4j:slf4j-android:1.7.36'

    testImplementation 'junit:junit:4.13.2'
    // Android's mockable android.jar has stubbed org.json methods in local JVM tests.
    testImplementation 'org.json:json:20260522'
}
